# Purpose: configuration for the formatter/linter (ruff) and the test runner (pytest).
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E/F: pycodestyle and pyflakes errors; I: import order; B: likely bugs;
# S: security checks; UP: modern syntax; ANN: require type hints (CODE-STYLE rule 16).
select = ["E", "F", "I", "B", "S", "UP", "ANN"]

[tool.ruff.lint.per-file-ignores]
# In tests only: `assert` is how pytest checks results (S101); fake secret values are
# intentional (S105); the git/Python subprocesses run fixed commands, never user input
# (S603, S607).
"**/tests/**" = ["S101", "S105", "S603", "S607"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings_test"
python_files = ["test_*.py"]
